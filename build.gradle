plugins {
    // Adiciona suporte a projetos Java (build, javadoc)
    id 'java'
    // Adiciona suporte para executar (run)
    id 'application' 
}

// Configuração para a compilação e execução a partir da main
application {
    // Define qual é a classe principal
    mainClass = 'Main' 
}

// Garante a leitura da entrada do usuário
tasks.named('run') {
    standardInput = System.in
    jvmArgs '-Dfile.encoding=UTF-8'
}

// Garante que a compilação leia os arquivos-fonte em UTF-8 (acentos em comentários e textos)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Garante que a geração do Javadoc não falhe por causa de acentos nos comentários
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

// Permite a implementação do JUnit
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform() // Obriga o Gradle a usar a plataforma do JUnit 
    
    // Opcional: Melhora a visualização no terminal (mostra quais testes passaram ou falharam)
    testLogging {
        events "passed", "skipped", "failed"
    }
}

